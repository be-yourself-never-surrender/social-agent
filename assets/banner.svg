      <text x="18" y="23" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">N</text>
      <text x="48" y="15" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">nova.ai</text>
      <circle cx="106" cy="10" r="6" fill="#1d9bf0"/>
