  <rect x="2" y="2" width="1276" height="376" rx="23" fill="url(#dots)"/>
  <rect x="2" y="2" width="1276" height="376" rx="23" fill="url(#glow1)"/>
  <rect x="2" y="2" width="1276" height="376" rx="23" fill="url(#glow2)"/>
  <rect x="2" y="2" width="1276" height="376" rx="23" fill="url(#glow3)"/>

  <!-- Left Content -->
