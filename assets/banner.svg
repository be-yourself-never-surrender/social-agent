      <text x="0" y="62" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" fill="#e2e8f0">Verified .ai Agent ID check-in live on BSC.</text>
      <text x="0" y="82" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" fill="#2aabee">#BNBChain  #AgentID  #SocialAgent</text>
      <rect x="0" y="96" width="66" height="20" rx="10" fill="#f43f5e" fill-opacity="0.16"/>
      <text x="33" y="110" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#fb7185" text-anchor="middle">♥ 148</text>
